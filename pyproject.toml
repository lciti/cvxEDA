[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cvxeda"
description = "Python implementation of the cvxEDA algorithm"
readme = {file = "README_PYTHON.md", content-type = "text/markdown"}
requires-python = ">=3.8"
license = {text = "GPL-3.0"}
authors = [
    {name = "Luca Citi", email = "lciti@ieee.org"},
]
keywords = ["EDA", "electrodermal", "affective computing", "convex optimisation"]
classifiers = [
    "Topic :: Scientific/Engineering",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
]

dynamic = ["version"]

dependencies = [
    "numpy>=1.16",
    "cvxopt>=1.3.1",
]

[project.urls]
Homepage = "https://github.com/lciti/cvxEDA"

[tool.setuptools.packages.find]
where = ["python"]
include = ["cvxeda*"]

[tool.setuptools.dynamic]
version = {attr = "cvxeda._version.__version__"}
